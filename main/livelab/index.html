<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>LiveLab Player</title>
<style>
:root{
  --bg:#f4f4f1;--card:#ffffff;--text:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;
  --accent:#c2410c;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--track:#e7e5df;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121211;--card:#1c1c1a;--text:#ecebe6;--muted:#9a9993;--line:#2c2c29;
    --accent:#fb923c;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--track:#2f2f2b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.lang{font:inherit;font-size:12px;padding:1px 8px;margin-left:4px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}.dot.pause{background:var(--warn)}.dot.err{background:var(--bad)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:7px 0;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.page{display:none;gap:14px;grid-template-columns:minmax(0,1fr)}.page.on{display:grid}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.now{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.cover{width:96px;height:96px;border-radius:10px;background:var(--track);object-fit:cover;display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover svg{width:40px;height:40px;fill:var(--muted)}
.title{font-size:18px;font-weight:600;line-height:1.3;word-break:break-word}
.sub{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.src{border-color:var(--accent);color:var(--accent)}
.badge.lossless{border-color:var(--good);color:var(--good)}
.badge.lossy{border-color:var(--warn);color:var(--warn)}
.progress{margin-top:14px}
.seek{padding:8px 0;margin:-8px 0;touch-action:none}
.seek.can{cursor:pointer}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s linear}
.seek.drag .bar>i{transition:none}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.ctrl button,.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
  width:44px;height:44px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ctrl button.main{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff}
.ctrl button:disabled,.icon:disabled{opacity:.35;cursor:default}
.ctrl svg,.icon svg{width:20px;height:20px;fill:currentColor}
.ctrl button.main svg{width:24px;height:24px}
h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 10px}
.vol{display:flex;align-items:center;gap:12px}
.vol input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.vol .num{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.opt.sel{border-color:var(--accent)}
.opt .n{font-weight:600}.opt .d{font-size:12px;color:var(--muted)}
.srcs{display:grid;gap:10px}
.srow{display:flex;align-items:center;gap:10px}
.srow .n{font-weight:600;width:64px;flex:none}
.srow .d{font-size:13px;color:var(--muted);flex:1;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row .k{font-size:14px}.row .k small{display:block;font-size:12px;color:var(--muted)}
.row .v{font-size:13px;color:var(--muted);text-align:right;word-break:break-all}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--track);border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px)}
.field{display:flex;gap:8px;margin-top:8px}
input[type=text],input[type=password],select{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad);color:var(--bad);display:none}
.ok{color:var(--good)}.bad{color:var(--bad)}
.nets{display:grid;gap:6px;margin-top:8px;max-height:240px;overflow:auto}
.net{display:flex;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.net.sel{border-color:var(--accent)}
.net small{color:var(--muted)}
.prog{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.prog>i{display:block;height:100%;width:0;background:var(--accent)}
.log{font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:8px;height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.log .w{color:var(--warn)}.log .e{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
footer{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name" data-i18n="appName"></h1>
    <div class="state"><span class="dot" id="dot"></span><span id="state" data-i18n="connecting"></span><button class="lang" id="lang"></button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-p="play" class="on" data-i18n="tabPlay"></button><button data-p="set" data-i18n="tabSet"></button><button data-p="sys" data-i18n="tabSys"></button>
  </nav>

  <div class="card err" id="err"></div>

  <!-- ================= Play ================= -->
  <div class="page on" id="p-play">
    <section class="card">
      <div class="now">
        <div class="cover" id="cover"></div>
        <div>
          <div class="title" id="title" data-i18n="idle"></div>
          <div class="sub" id="sub"></div>
          <div class="badges" id="badges"></div>
        </div>
      </div>
      <div class="progress">
        <div class="seek" id="seek"><div class="bar"><i id="bar"></i></div></div>
        <div class="times"><span id="pos">0:00</span><span id="dur">—</span></div>
      </div>
      <div class="ctrl">
        <button id="prev" title="" data-i18n-t="prev"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="2.5" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.5.86L9.3 13.7a.95.95 0 0 1 0-1.62l8.2-4.95A1 1 0 0 1 19 6.2z"/></svg></button>
        <button id="pp" class="main" title="" data-i18n-t="playPause"><svg viewBox="0 0 24 24" id="ppIcon"></svg></button>
        <button id="next" title="" data-i18n-t="next"><svg viewBox="0 0 24 24"><rect x="16.5" y="5" width="2.5" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.5.86l8.2-4.96a.95.95 0 0 0 0-1.62L6.5 7.14A1 1 0 0 0 5 6.2z"/></svg></button>
        <button id="stop" title="" data-i18n-t="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      </div>
    </section>

    <section class="card" id="volCard">
      <h2 data-i18n="volume"></h2>
      <div class="vol">
        <button class="icon" id="mute" title="" data-i18n-t="mute"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
        <input type="range" id="vol" min="0" max="100" step="1" data-i18n-t="volume">
        <span class="num" id="volNum">—</span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="output"></h2>
      <div class="opts" id="outputs"></div>
    </section>

    <section class="card" id="techCard">
      <h2 data-i18n="tech"></h2>
      <div class="stats" id="tech"></div>
    </section>

    <section class="card">
      <h2 data-i18n="sources"></h2>
      <div class="srcs" id="srcs"></div>
    </section>
  </div>

  <!-- ================= Settings ================= -->
  <div class="page" id="p-set">
    <section class="card">
      <h2 data-i18n="devName"></h2>
      <div class="field"><input type="text" id="devName" maxlength="40" autocomplete="off"><button class="btn" id="saveName" data-i18n="save"></button></div>
    </section>

    <section class="card">
      <h2 data-i18n="audio"></h2>
      <div class="row">
        <div class="k"><span data-i18n="fixedOpt"></span><small data-i18n="fixedOptNote"></small></div>
        <label class="switch"><input type="checkbox" id="fixedOpt"><span></span></label>
      </div>
    </section>

    <section class="card">
      <h2>AirPlay</h2>
      <div class="row">
        <div class="k"><span data-i18n="apV1"></span><small data-i18n="apV1Note"></small></div>
        <label class="switch"><input type="checkbox" id="apV1"><span></span></label>
      </div>
      <div class="note" id="apNote"></div>
    </section>

    <section class="card">
      <h2>WiFi</h2>
      <div class="row"><div class="k" data-i18n="curNet"></div><div class="v" id="wifiNow">—</div></div>
      <div class="btns" style="margin-top:6px"><button class="btn ghost" id="scan" data-i18n="scan"></button></div>
      <div class="nets" id="nets"></div>
      <div class="field"><input type="text" id="ssid" data-i18n-ph="ssidPh" autocomplete="off"></div>
      <div class="field"><input type="password" id="pass" data-i18n-ph="pass" autocomplete="off"><button class="btn" id="saveWifi" data-i18n="saveWifi"></button></div>
      <div class="note" data-i18n="wifiNote"></div>
    </section>
  </div>

  <!-- ================= System ================= -->
  <div class="page" id="p-sys">
    <section class="card">
      <h2 data-i18n="devInfo"></h2>
      <div class="stats" id="info"></div>
    </section>

    <section class="card">
      <h2 data-i18n="fwUpdate"></h2>
      <div class="field"><input type="file" id="fw" accept=".bin" style="flex:1;min-width:0;font-size:13px"><button class="btn" id="upload" data-i18n="upload"></button></div>
      <div class="prog" id="fwProg"><i id="fwBar"></i></div>
      <div class="note" id="fwNote"></div>
    </section>

    <section class="card">
      <h2 data-i18n="log"></h2>
      <div class="btns"><button class="btn ghost" id="logBtn" data-i18n="start"></button><button class="btn ghost" id="logClear" data-i18n="clear"></button></div>
      <div class="log" id="log"></div>
    </section>

    <section class="card">
      <h2 data-i18n="maint"></h2>
      <div class="btns"><button class="btn danger" id="reboot" data-i18n="reboot"></button></div>
    </section>
  </div>

  <footer id="foot"></footer>
</main>
<script>
// All user-visible strings. {0}, {1} are replaced by t() arguments.
const I18N = {
  zh: {
    langName:'中文', appName:'LiveLab 播放器', connecting:'连接中…', disconnected:'连接断开', rebooting:'重启中…',
    tabPlay:'播放', tabSet:'设置', tabSys:'系统',
    idle:'空闲', playing:'播放中', paused:'已暂停', stopped:'已停止', buffering:'缓冲中', connected:'已连接',
    prev:'上一首', next:'下一首', playPause:'播放/暂停', stop:'停止', volume:'音量', mute:'静音',
    output:'输出', tech:'技术信息', sources:'音源', bt:'蓝牙', btAudio:'蓝牙音频', unknownTrack:'未知曲目',
    lossless:'无损', lossy:'有损', sbcLossy:'SBC 有损', optical:'光纤', out_spdif:'光纤 S/PDIF', out_analog:'3.5mm 模拟',
    curOut:'当前输出', tapSwitch:'点击切换',
    idleHint:'可以用网易云「连接 DLNA 设备」、iPhone 的 AirPlay 或蓝牙推送到「{0}」',
    avgKbps:'平均码率', liveKbps:'实时码率', fileSize:'文件大小', downloaded:'已下载', buffer:'缓冲', sec:'秒',
    startMs:'起播耗时', underruns:'断流次数', decCpu:'解码 CPU', host:'音源服务器', outFmt:'输出格式',
    dlnaHint:'网易云 →「连接 DLNA 设备」', apHint:'iPhone 控制中心 → AirPlay', btOff:'此固件未开启蓝牙',
    btHint:'手机蓝牙设置，配对码 05032026',

    day:'天', hour:'时', min:'分', heap:'内部内存', heapMin:'KB（最低 {0}）', psramFree:'MB 可用', fw:'固件',

    devName:'设备名称', save:'保存', audio:'音频', fixedOpt:'光纤固定音量',
    fixedOptNote:'打开时光纤输出原始数据（比特完美），音量在音箱上调；关闭后手机和网页的音量对光纤也生效',
    apV1:'兼容模式（AirPlay 1）', apV1Note:'只用旧版协议：iPhone 发 ALAC 无损，但不能多房间同步。修改后重启生效',
    curNet:'当前网络', scan:'扫描网络', scanning:'扫描中…', rescan:'重新扫描', ssidPh:'网络名称（只支持 2.4GHz）',
    pass:'密码', saveWifi:'保存并重启',
    wifiNote:'保存后板子会重启并连接新网络；连不上时会开出热点「ESP32-AirPlay-Setup」，连上后打开 192.168.4.1 重新设置。',
    restartNeeded:'已修改，重启后生效', savedReboot:'已保存。现在重启让新名字生效吗？', saveFail:'保存失败：{0}',
    channel:'信道 {0}', noNets:'没有找到网络', scanFail:'扫描失败：{0}', needSsid:'请填写网络名称',
    confirmWifi:'保存「{0}」并重启？连接失败时板子会开出热点「ESP32-AirPlay-Setup」。',
    devInfo:'设备信息', fwUpdate:'固件升级', upload:'上传', log:'日志', start:'开始', clear:'清空', maint:'维护',
    reboot:'重启设备', confirmReboot:'确定重启设备？正在播放的音乐会中断。', needFw:'请先选择固件文件',

    fwOk:'升级成功，正在重启…', fwFail:'升级失败：{0}', uploadAbort:'上传中断'
  },
  en: {
    langName:'EN', appName:'LiveLab Player', connecting:'Connecting…', disconnected:'Disconnected', rebooting:'Restarting…',
    tabPlay:'Play', tabSet:'Settings', tabSys:'System',
    idle:'Idle', playing:'Playing', paused:'Paused', stopped:'Stopped', buffering:'Buffering', connected:'Connected',
    prev:'Previous', next:'Next', playPause:'Play/Pause', stop:'Stop', volume:'Volume', mute:'Mute',
    output:'Output', tech:'Technical info', sources:'Sources', bt:'Bluetooth', btAudio:'Bluetooth audio', unknownTrack:'Unknown track',
    lossless:'Lossless', lossy:'Lossy', sbcLossy:'SBC lossy', optical:'Optical', out_spdif:'Optical S/PDIF', out_analog:'3.5mm analog',
    curOut:'Current output', tapSwitch:'Tap to switch',
    idleHint:'Cast to "{0}" via NetEase Cloud Music (Connect DLNA device), iPhone AirPlay or Bluetooth',
    avgKbps:'Avg bitrate', liveKbps:'Live bitrate', fileSize:'File size', downloaded:'Downloaded', buffer:'Buffer', sec:'s',
    startMs:'Start time', underruns:'Underruns', decCpu:'Decode CPU', host:'Source server', outFmt:'Output format',
    dlnaHint:'NetEase Cloud Music → Connect DLNA device', apHint:'iPhone Control Center → AirPlay', btOff:'Bluetooth not enabled in this firmware',
    btHint:'Phone Bluetooth settings, PIN 05032026',
    ip:'IP address', signal:'Signal', good:'good', fair:'fair', weak:'weak', dbmQ:'dBm ({0})', uptime:'Uptime',
    day:'d', hour:'h', min:'m', heap:'Internal RAM', heapMin:'KB (min {0})', psramFree:'MB free', fw:'Firmware',
    wifiNow:'{0} ({1} dBm)', notConn:'Not connected',
    devName:'Device name', save:'Save', audio:'Audio', fixedOpt:'Fixed optical volume',
    fixedOptNote:'On: optical outputs the raw data (bit-perfect); set volume on the speaker. Off: phone and web volume also apply to optical',
    apV1:'Compatibility mode (AirPlay 1)', apV1Note:'Legacy protocol only: iPhone sends lossless ALAC, but no multi-room sync. Takes effect after restart',
    curNet:'Current network', scan:'Scan networks', scanning:'Scanning…', rescan:'Scan again', ssidPh:'Network name (2.4 GHz only)',
    pass:'Password', saveWifi:'Save & restart',
    wifiNote:'The board restarts and joins the new network. If it cannot connect, it opens the hotspot "ESP32-AirPlay-Setup"; join it and open 192.168.4.1 to set up again.',

    devInfo:'Device info', fwUpdate:'Firmware update', upload:'Upload', log:'Log', start:'Start', clear:'Clear', maint:'Maintenance',
    reboot:'Restart device', confirmReboot:'Restart the device? Playback will be interrupted.', needFw:'Please choose a firmware file first',
    confirmFw:'Upload {0} ({1} MB) and update? Do not power off during the update.', uploading:'Uploading {0}%',
    fwOk:'Update succeeded, restarting…', fwFail:'Update failed: {0}', uploadAbort:'Upload interrupted'
  }
};
let lang = null;
try { lang = localStorage.getItem('lang'); } catch (e) {}
if (!I18N[lang]) lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
const t = (k, ...a) => String(I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i]);
// Set an element's text from a key and remember the key so a language switch re-translates it
const setT = (el, k) => { el.dataset.i18n = k; el.textContent = k ? t(k) : ''; };
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { if (el.dataset.i18n) el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-t]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.i18nT));
    if (el.hasAttribute('title')) el.title = t(el.dataset.i18nT);
  });
  $('lang').textContent = I18N[lang === 'zh' ? 'en' : 'zh'].langName;  // label shows the other language
  if (!cur) document.title = t('appName');
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = s => { s = Math.max(0, Math.floor(s||0)); const m = Math.floor(s/60), h = Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}` : `${m}:${String(s%60).padStart(2,'0')}`; };
const fmtB = b => b >= 1048576 ? (b/1048576).toFixed(1)+'<small>MB</small>' : b >= 1024 ? (b/1024).toFixed(0)+'<small>KB</small>' : (b||0)+'<small>B</small>';
const kHz = r => (r/1000).toFixed(r%1000 ? 1 : 0) + ' kHz';
const SRC = id => ({dlna:'DLNA', airplay:'AirPlay', bluetooth:t('bt')})[id] || '';
// Output options are localised by id; unknown ids fall back to the firmware's name
const outName = o => I18N.en['out_' + o.id] ? t('out_' + o.id) : o.name;
const ICON_PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
const ICON_PAUSE = '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>';
const ICON_VOL = '<path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.6A1 1 0 0 0 14 18.3V5.7a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
const ICON_MUTE = '<path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.6A1 1 0 0 0 14 18.3V5.7a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z"/><path d="M17 9.5l4 5M21 9.5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
const ICON_SRC = {
  dlna:'<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
  airplay:'<path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2l-1.5-2H19V6H5v9h3.5L7 17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm7 9l5 7H7z"/>',
  bluetooth:'<path d="M11 2l7 6-5 4 5 4-7 6v-8l-4 3.2-1.3-1.5L10.6 12 5.7 8.3 7 6.8 11 10V2zm2 4.3v3.3l2-1.6zm0 8.1v3.3l2-1.7z"/>',
  none:'<path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'};

let cur = null, dragging = false, volDragging = false, lastArt = null, outSig = '', hist = [], posAt = -1, npT0 = 0;

applyI18n();
$('lang').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyI18n();
  outSig = '';
  tick();
};

// ---------- Tabs ----------
$('tabs').onclick = e => {
  const p = e.target.dataset.p; if (!p) return;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  if (p === 'set') loadSettings();
};

async function post(url, body, json) {
  const r = await fetch(url, {method:'POST', body: json ? JSON.stringify(body) : body,
    headers: json ? {'Content-Type':'application/json'} : {}});
  const t = await r.text();
  if (!r.ok) throw new Error(t || r.status);
  return t;
}
async function control(cmd) {
  try { await post('/api/ll/control', cmd); } catch (e) { alert(e.message); }
  tick();
}

// ---------- Playback controls ----------
$('pp').onclick = () => control(isPlaying() ? 'pause' : 'play');
$('stop').onclick = () => control('stop');
$('prev').onclick = () => control('prev');
$('next').onclick = () => control('next');
function isPlaying() {
  if (!cur) return false;
  return cur.source === 'dlna' ? cur.state === 'PLAYING' : !!(cur.np && cur.np.playing);
}
function seekFrac(e) {
  const r = $('seek').getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
}
const canSeek = () => cur && cur.source === 'dlna' && cur.duration && ['PLAYING','PAUSED_PLAYBACK'].includes(cur.state);
$('seek').onpointerdown = e => {
  if (!canSeek()) return;
  dragging = true; $('seek').classList.add('drag'); $('seek').setPointerCapture(e.pointerId);
  const f = seekFrac(e); $('bar').style.width = f * 100 + '%'; $('pos').textContent = fmtT(f * cur.duration);
};
$('seek').onpointermove = e => {
  if (!dragging) return;
  const f = seekFrac(e); $('bar').style.width = f * 100 + '%'; $('pos').textContent = fmtT(f * cur.duration);
};
$('seek').onpointerup = e => {
  if (!dragging) return;
  dragging = false; $('seek').classList.remove('drag');
  control('seek:' + (seekFrac(e) * cur.duration).toFixed(1));
};

// ---------- Volume ----------
$('vol').oninput = () => { volDragging = true; $('volNum').textContent = $('vol').value; };
$('vol').onchange = async () => { await control('volume:' + $('vol').value); volDragging = false; };
$('mute').onclick = () => control('mute:' + (cur && cur.vol.muted ? 0 : 1));

function liveKbps(s) {
  if (s.state !== 'PLAYING') { hist = []; return null; }
  hist.push([s.consumed, s.position]);
  if (hist.length > 7) hist.shift();
  const [c0, p0] = hist[0], [c1, p1] = hist[hist.length-1];
  if (p1 - p0 < 2 || c1 < c0) return null;
  return Math.round((c1 - c0) * 8 / (p1 - p0) / 1000);
}

function renderOutputs(s) {
  const sig = s.output + JSON.stringify(s.outputs);
  if (sig === outSig) return;
  outSig = sig;
  $('outputs').innerHTML = s.outputs.map(o => `
    <label class="opt ${o.id===s.output?'sel':''}">
      <input type="radio" name="out" value="${o.id}" ${o.id===s.output?'checked':''} ${o.available?'':'disabled'}>
      <div><div class="n">${esc(outName(o))}</div><div class="d">${o.available ? t(o.id===s.output?'curOut':'tapSwitch') : esc(o.note)}</div></div>
    </label>`).join('');
  document.querySelectorAll('input[name=out]').forEach(el => el.onchange = async () => {
    try { await post('/api/ll/output', el.value); } catch (e) { alert(e.message); }
    outSig = ''; tick();
  });
}

function setCover(src, art) {
  const key = src + '|' + art;
  if (key === lastArt) return;
  lastArt = key;
  $('cover').innerHTML = art ? `<img src="${esc(art)}" alt="" onerror="this.remove()">`
                             : `<svg viewBox="0 0 24 24">${ICON_SRC[src] || ICON_SRC.none}</svg>`;
}

function stat(k, v) { return `<div class="stat"><div class="k">${t(k)}</div><div class="v">${v}</div></div>`; }

function render(s) {
  cur = s;
  const src = s.source, dl = src === 'dlna';
  ['name', 'state', 'title'].forEach(i => $(i).removeAttribute('data-i18n'));
  $('name').textContent = s.dev.name || t('appName');
  document.title = s.dev.name || t('appName');

  // Status
  let label = 'idle', cls = '';
  if (dl) {
    const M = {PLAYING:['playing','on'],PAUSED_PLAYBACK:['paused','pause'],STOPPED:['stopped',''],TRANSITIONING:['buffering','pause']};
    [label, cls] = M[s.state] || ['idle', ''];
  } else if (src !== 'none') {
    [label, cls] = s.np.playing ? ['playing','on'] : ['paused','pause'];
  }
  $('state').textContent = (SRC(src) ? SRC(src) + ' · ' : '') + t(label);
  $('dot').className = 'dot ' + (dl && s.error ? 'err' : cls);
  $('err').style.display = dl && s.error ? 'block' : 'none';
  $('err').textContent = s.error;

  // Now playing
  let title, sub, dur = 0, pos = 0;
  const b = [];
  if (SRC(src)) b.push(`<span class="badge src">${SRC(src)}</span>`);
  if (dl) {
    title = s.title || t('unknownTrack');
    sub = [s.artist, s.album].filter(Boolean).join(' · ');
    dur = s.duration; pos = s.position;
    setCover('dlna', s.art ? s.art + (s.art.includes('?') ? '' : '?param=300y300') : '');
    if (s.codec) b.push(`<span class="badge ${s.lossless?'lossless':'lossy'}">${t(s.lossless?'lossless':'lossy')} ${s.codec}</span>`);
    if (s.rate) b.push(`<span class="badge">${kHz(s.rate)} · ${s.bits} bit</span>`);
  } else if (src !== 'none') {
    title = s.np.title || (src === 'airplay' ? 'AirPlay' : t('btAudio'));
    sub = [s.np.artist, s.np.album].filter(Boolean).join(' · ');
    dur = s.np.duration;
    // AirPlay/Bluetooth only report position on metadata updates; extrapolate while playing
    if (s.np.position !== posAt) { posAt = s.np.position; npT0 = Date.now(); }
    pos = s.np.position + (s.np.playing && npT0 ? (Date.now() - npT0) / 1000 : 0);
    setCover(src, '');
    b.push(`<span class="badge ${src==='airplay'?'':'lossy'}">${src==='airplay' ? 'AAC / ALAC' : t('sbcLossy')}</span>`);
    b.push(`<span class="badge">${kHz(s.outRate)} · ${s.outBits} bit</span>`);
  } else {
    title = t('idle');
    sub = t('idleHint', s.dev.name);
    setCover('none', '');
  }
  b.push(`<span class="badge">${s.output === 'spdif' ? t('optical') : '3.5mm'}</span>`);
  $('title').textContent = title;
  $('sub').textContent = sub;
  $('badges').innerHTML = b.join('');
  if (!dragging) {
    $('pos').textContent = dur ? fmtT(Math.min(pos, dur)) : '—';
    $('bar').style.width = dur ? Math.min(100, pos / dur * 100) + '%' : '0';
  }
  $('dur').textContent = dur ? fmtT(dur) : '—';
  $('seek').classList.toggle('can', !!canSeek());

  // Buttons: DLNA has stop and seek; AirPlay/Bluetooth have previous/next
  const active = dl ? ['PLAYING','PAUSED_PLAYBACK','STOPPED'].includes(s.state) && !!s.title : src !== 'none';
  $('ppIcon').innerHTML = isPlaying() ? ICON_PAUSE : ICON_PLAY;
  $('pp').disabled = !active;
  $('stop').style.display = dl ? '' : 'none';
  $('stop').disabled = !['PLAYING','PAUSED_PLAYBACK'].includes(s.state);
  $('prev').style.display = $('next').style.display = (src === 'airplay' || src === 'bluetooth') ? '' : 'none';
  $('prev').disabled = $('next').disabled = src === 'airplay' && !s.airplay.remote;

  // Volume
  const v = s.vol;
  if (!volDragging) { $('vol').value = v.value; $('volNum').textContent = v.muted ? t('mute') : v.value; }
  $('vol').disabled = $('mute').disabled = !v.settable;
  $('muteIcon').innerHTML = v.muted ? ICON_MUTE : ICON_VOL;
  $('volCard').style.display = v.settable && v.applies ? '' : 'none';

  renderOutputs(s);

  // Technical info
  let tx = '';
  if (dl) {
    const lk = liveKbps(s), bufSec = s.avgKbps ? s.buf * 8 / s.avgKbps / 1000 + s.pcmMs / 1000 : 0;
    tx = stat('avgKbps', s.avgKbps ? s.avgKbps + '<small>kbps</small>' : '—') + stat('liveKbps', lk ? lk + '<small>kbps</small>' : '—')
      + stat('fileSize', s.size > 0 ? fmtB(s.size) : '—') + stat('downloaded', s.size > 0 ? Math.min(100, s.downloaded / s.size * 100).toFixed(0) + '<small>%</small>' : '—')
      + stat('buffer', s.codec ? (s.avgKbps ? bufSec.toFixed(1) + `<small>${t('sec')}</small>` : fmtB(s.buf)) : '—')
      + stat('startMs', s.startMs >= 0 ? s.startMs + '<small>ms</small>' : '—')
      + stat('underruns', s.codec ? String(s.underruns) : '—') + stat('decCpu', s.state === 'PLAYING' && s.codec ? s.decLoad + '<small>%</small>' : '—')
      + stat('host', `<span style="font-size:13px;font-weight:500">${esc(s.host || '—')}</span>`);
  } else {
    hist = [];
    tx = stat('outFmt', `${kHz(s.outRate)} · ${s.outBits} bit`) + stat('output', esc(outName({id: s.output, name: s.output})));
  }
  $('tech').innerHTML = tx;

  // Source overview
  const row = (n, ok, d) => `<div class="srow"><span class="dot ${ok}"></span><span class="n">${n}</span><span class="d">${d}</span></div>`;
  $('srcs').innerHTML =
    row('DLNA', dl ? (s.state === 'PLAYING' ? 'on' : 'pause') : '', dl ? esc(s.title || t('connected')) : t('dlnaHint'))
    + row('AirPlay', s.airplay.playing ? 'on' : s.airplay.connected ? 'pause' : '', t(s.airplay.playing ? 'playing' : s.airplay.connected ? 'connected' : 'apHint'))
    + row(t('bt'), s.bt.playing ? 'on' : s.bt.connected ? 'pause' : '', t(!s.bt.supported ? 'btOff'
        : s.bt.playing ? 'playing' : s.bt.connected ? 'connected' : 'btHint'));

  // System info
  const d = s.dev, up = d.uptime, q = t(d.rssi >= -60 ? 'good' : d.rssi >= -72 ? 'fair' : 'weak');
  $('info').innerHTML = stat('ip', d.ip) + stat('WiFi', d.ssid ? `${esc(d.ssid)}` : '—')
    + stat('signal', d.rssi ? `${d.rssi}<small>${t('dbmQ', q)}</small>` : '—')
    + stat('uptime', `${Math.floor(up/86400)}<small>${t('day')}</small>${Math.floor(up/3600)%24}<small>${t('hour')}</small>${Math.floor(up/60)%60}<small>${t('min')}</small>`)
    + stat('heap', `${(d.heap/1024).toFixed(0)}<small>${t('heapMin', (d.heapMin/1024).toFixed(0))}</small>`)
    + stat('PSRAM', `${(d.psram/1048576).toFixed(2)}<small>${t('psramFree')}</small>`)
    + stat('fw', `<span style="font-size:13px">${esc(d.fw)}</span>`) + stat('MAC', `<span style="font-size:13px">${esc(d.mac)}</span>`);
  $('wifiNow').textContent = d.ssid ? t('wifiNow', d.ssid, d.rssi) : t('notConn');
  $('foot').textContent = `${d.name} · ${d.ip} · ESP-IDF ${d.idf}`;
}

async function tick() {
  try {
    const r = await fetch('/api/ll/status', {cache:'no-store'});
    render(await r.json());
  } catch (e) {
    $('state').textContent = t('disconnected');
    $('dot').className = 'dot err';
  }
}
tick();
setInterval(tick, 1000);

// ---------- Settings ----------
async function loadSettings() {
  if (cur) { $('devName').value = cur.dev.name; $('fixedOpt').checked = cur.fixedOptical; }
  try {
    const a = await (await fetch('/api/airplay/mode')).json();
    $('apV1').checked = !!a.v1;
    setT($('apNote'), a.restart_required ? 'restartNeeded' : '');
  } catch (e) {}
}
$('saveName').onclick = async () => {
  const name = $('devName').value.trim();
  if (!name) return;
  try {
    const r = JSON.parse(await post('/api/device/name', {name}, true));
    if (!r.success) throw new Error(r.error);
    if (confirm(t('savedReboot'))) reboot(true);
  } catch (e) { alert(t('saveFail', e.message)); }
};
$('fixedOpt').onchange = async () => {
  try { await post('/api/ll/settings', 'fixed_optical=' + ($('fixedOpt').checked ? 1 : 0)); } catch (e) { alert(e.message); }
  tick();
};
$('apV1').onchange = async () => {
  try {
    const r = JSON.parse(await post('/api/airplay/mode', {v1: $('apV1').checked}, true));
    setT($('apNote'), r.restart_required ? 'restartNeeded' : '');
  } catch (e) { alert(e.message); }
};
$('scan').onclick = async () => {
  $('scan').disabled = true; setT($('scan'), 'scanning');
  try {
    const r = await (await fetch('/api/wifi/scan')).json();
    const nets = (r.networks || []).filter(n => n.ssid).sort((a, b) => b.rssi - a.rssi);
    const seen = new Set();
    $('nets').innerHTML = nets.filter(n => !seen.has(n.ssid) && seen.add(n.ssid)).map(n =>
      `<div class="net" data-s="${esc(n.ssid)}"><span>${esc(n.ssid)}</span><small>${n.rssi} dBm · ${t('channel', n.channel)}</small></div>`).join('')
      || `<div class="note">${t('noNets')}</div>`;
  } catch (e) { alert(t('scanFail', e.message)); }
  $('scan').disabled = false; setT($('scan'), 'rescan');
};
$('nets').onclick = e => {
  const n = e.target.closest('.net'); if (!n) return;
  document.querySelectorAll('.net').forEach(x => x.classList.toggle('sel', x === n));
  $('ssid').value = n.dataset.s; $('pass').focus();
};
$('saveWifi').onclick = async () => {
  const ssid = $('ssid').value.trim();
  if (!ssid) return alert(t('needSsid'));
  if (!confirm(t('confirmWifi', ssid))) return;
  try {
    const r = JSON.parse(await post('/api/wifi/config', {ssid, password: $('pass').value}, true));
    if (!r.success) throw new Error(r.error);
    reboot(true);
  } catch (e) { alert(t('saveFail', e.message)); }
};

// ---------- System ----------
async function reboot(skipConfirm) {
  if (!skipConfirm && !confirm(t('confirmReboot'))) return;
  try { await post('/api/system/restart', ''); } catch (e) {}
  $('state').textContent = t('rebooting');
  waitBack();
}
$('reboot').onclick = () => reboot(false);
function waitBack() {
  let n = 0;
  const t = setInterval(async () => {
    try { await fetch('/api/ll/status', {cache:'no-store'}); clearInterval(t); location.reload(); }
    catch (e) { if (++n > 90) clearInterval(t); }
  }, 2000);
}
$('upload').onclick = () => {
  const f = $('fw').files[0];
  if (!f) return alert(t('needFw'));
  if (!confirm(t('confirmFw', f.name, (f.size/1048576).toFixed(2)))) return;
  const x = new XMLHttpRequest();
  $('fwProg').style.display = 'block'; $('upload').disabled = true;
  x.upload.onprogress = e => { if (e.lengthComputable) { $('fwBar').style.width = e.loaded / e.total * 100 + '%'; $('fwNote').textContent = t('uploading', (e.loaded / e.total * 100).toFixed(0)); } };
  x.onload = () => {
    if (x.status === 200) { $('fwNote').innerHTML = `<span class="ok">${t('fwOk')}</span>`; waitBack(); }
    else { $('fwNote').innerHTML = `<span class="bad">${esc(t('fwFail', x.responseText || x.status))}</span>`; $('upload').disabled = false; }
  };
  x.onerror = () => { $('fwNote').innerHTML = `<span class="bad">${t('uploadAbort')}</span>`; $('upload').disabled = false; };
  x.open('POST', '/api/ota/update');
  x.send(f);
};

let ws = null, logRest = '';
$('logBtn').onclick = () => {
  if (ws) { ws.close(); return; }
  ws = new WebSocket(`ws://${location.host}/ws/logs`);
  setT($('logBtn'), 'stop');
  ws.onmessage = e => {
    const el = $('log'), stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    // A frame is not always a whole line: keep the trailing partial line for the next frame
    const parts = (logRest + String(e.data)).replace(/\x1b\[[0-9;]*m/g, '').split('\n');
    logRest = parts.pop();
    parts.filter(Boolean).forEach(line => {
      const d = document.createElement('div');
      d.textContent = line;
      if (/^E \(/.test(line)) d.className = 'e'; else if (/^W \(/.test(line)) d.className = 'w';
      el.appendChild(d);
    });
    while (el.childNodes.length > 800) el.removeChild(el.firstChild);
    if (stick) el.scrollTop = el.scrollHeight;
  };
  ws.onclose = () => { ws = null; setT($('logBtn'), 'start'); };
};
$('logClear').onclick = () => { $('log').innerHTML = ''; };
</script>
</body>
</html>
